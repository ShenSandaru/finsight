name: release-please

on:
  push:
    branches:
      - main # Triggers every time you merge to main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # This tells the tool your project type (node, python, go, generic, etc.)
          release-type: python 
